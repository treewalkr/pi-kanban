name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # 30s per test, matching the pre-review gate: subprocess-heavy CLI tests
      # exceed bun's 5s default on a 2-core runner
      - run: bun test --timeout 30000
